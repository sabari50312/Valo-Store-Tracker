name: Release APK

# Builds a signed APK and publishes it as a GitHub Release. Two ways to start it:
#   - Actions tab > Release APK > Run workflow, and enter a version like 1.2.0.
#     Leave the version empty for a test build (downloadable artifact, no release).
#   - Push a tag like v1.2.0.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.2.0. Leave empty for a test build without a release.
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Work out version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
            release=true
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::v$version already exists. Pick a higher version."
              exit 1
            fi
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
            release=false
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.0, got \"$version\""
            exit 1
          fi
          echo "app=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Generate Android project
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: |
          path="val-store-${APP_VERSION}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        # --target creates the tag on this commit when the run came from the Actions tab.
        run: gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
